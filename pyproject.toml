[project]
name = "amazing"
version = "1.0.0"
description = "AMAZING (Ahl, 1978) reborn as a modern Python TUI maze game."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "AMAZING 2026" },
]
keywords = ["maze", "retro", "textual", "tui", "basic", "ahl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Terminals",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.103",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "textual-dev>=1.5",
]

[project.scripts]
amazing = "amazing.presentation.cli:app"

[project.urls]
Homepage = "https://github.com/davidvivo-ia/amazing.python"
Issues = "https://github.com/davidvivo-ia/amazing.python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazing"]

[tool.hatch.build.targets.sdist]
include = ["src/amazing", "legacy", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.103",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "textual-dev>=1.5",
    "pytest-asyncio>=1.3.0",
]

# ----------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["legacy/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle + pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # flake8-simplify
    "C4",                 # comprehensions
    "PIE",                # pie
    "PT",                 # pytest style
    "RET",                # return
    "RUF",                # ruff-specific
    "N",                  # pep8-naming
    "D",                  # pydocstyle
    "ANN",                # annotations
    "PL",                 # pylint subset
    "TID",                # tidy imports
    "TRY",                # try/except antipatterns
]
ignore = [
    "D203",   # one-blank-line-before-class
    "D213",   # multi-line-summary-second-line
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # docstrings in dunder methods (slots/frozen don't need them)
    "D107",   # docstrings in __init__ (the class docstring already covers it)
    "ANN401", # disallow Any -- we use it sparingly and on purpose
    "PLR0913", # too many args -- not pedantic about this
    "TRY003", # long messages in raise -- we like context
    "RUF002", # ambiguous unicode in docstrings (we want × not x)
    "N818",   # exception suffix Error -- AmazingError is the base; subtypes are nouns
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "S101", "RUF007", "RUF001"]
"src/amazing/__main__.py" = ["D"]
"src/amazing/presentation/cli.py" = ["PLC0415"]  # lazy Textual import on purpose
"tests/property/test_carve_properties.py" = ["D", "ANN", "PLR2004", "S101", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
files = ["src"]
exclude = ["legacy/.*"]

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = false

# ----------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/amazing",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: tests that take >1s",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:.*custom event loop.*:DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src/amazing"]
omit = ["src/amazing/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
